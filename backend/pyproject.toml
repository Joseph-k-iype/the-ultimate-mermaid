[project]
name = "patternviz"
version = "0.1.0"
description = "PatternViz - Code pattern visualization backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "gitpython>=3.1.40",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
    "falkordb>=1.0.0",
    "certifi>=2024.2.2",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
agents = [
    "google-adk>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
